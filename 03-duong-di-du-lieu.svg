<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 615" role="img" aria-label="03-duong-di-du-lieu"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607b8b"/></marker></defs><rect width="100%" height="100%" fill="#f6f9fc"/><path d="M155,94 L155,150" stroke="#607b8b" stroke-width="2" marker-end="url(#arrow)"/><path d="M155,214 L155,270" stroke="#607b8b" stroke-width="2" marker-end="url(#arrow)"/><path d="M155,334 L155,390" stroke="#607b8b" stroke-width="2" marker-end="url(#arrow)"/><path d="M155,454 L155,510" stroke="#607b8b" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="30" width="250" height="64" rx="12" fill="#ffffff" stroke="#9ab5c5"/><text x="155" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">mock_knowledge.json</text><text x="155" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">Dữ liệu đã chia đoạn</text><rect x="30" y="150" width="250" height="64" rx="12" fill="#ffffff" stroke="#9ab5c5"/><text x="155" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">load_records()</text><text x="155" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">Kiểm tra rồi thay toàn bộ kho</text><rect x="30" y="270" width="250" height="64" rx="12" fill="#ffffff" stroke="#9ab5c5"/><text x="155" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">SQLite: records(id, body)</text><text x="155" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">body là một bản ghi JSON</text><rect x="30" y="390" width="250" height="64" rx="12" fill="#ffffff" stroke="#9ab5c5"/><text x="155" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">all_records() → RAM</text><text x="155" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">Chạy khi mở server</text><rect x="30" y="510" width="250" height="64" rx="12" fill="#ffffff" stroke="#9ab5c5"/><text x="155" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">retrieve() → citations</text><text x="155" y="556" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">Tìm lại mỗi câu hỏi</text><rect x="410" y="30" width="250" height="64" rx="12" fill="#ffffff" stroke="#9ab5c5"/><text x="535" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">data/MOCK/*.md</text><text x="535" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">Bản đối chiếu đọc được</text><rect x="410" y="390" width="250" height="64" rx="12" fill="#ffffff" stroke="#9ab5c5"/><text x="535" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">Sau khi ingest lại dữ liệu</text><text x="535" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#19364a">Khởi động lại app để nạp RAM</text></svg>